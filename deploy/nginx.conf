server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: unknown paths resolve to index.html (the app is a single page).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the content-hashed asset bundle; never cache the HTML shell.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
